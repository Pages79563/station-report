.hero:after{content:"";position:absolute;inset:auto 0 0;height:6px;background:linear-gradient(90deg,#0d87c8,#4cc8ef)}
.wrap{max-width:1050px;margin:auto}
.brand{display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);padding:6px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.brand img{display:block;width:105px;height:auto;max-height:52px;object-fit:contain}
.hero h1{margin:82px 0 5px;font-size:32px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero p{margin:0;color:#eefaff;font-size:14px}
.card{background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(23,63,95,.12);padding:22px;margin:-32px 14px 25px;position:relative}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
input,textarea{width:100%;border:1px solid #cddfe9;border-radius:10px;padding:12px;font:inherit;background:#fff}
input:focus,textarea:focus{outline:2px solid #b8e6f6;border-color:var(--blue)}
.section-title{font-size:19px;margin:28px 0 12px;border-right:5px solid var(--blue);padding:8px 11px;background:#f0f9fd;border-radius:7px}
.item{border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0;background:#fff}
.item-name{font-weight:800;line-height:1.9;font-size:15px}
.options{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.opt input{display:none}.opt span{display:inline-block;border:1px solid #c7dce7;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px}
.opt input:checked+span{background:var(--blue);color:white;border-color:var(--blue)}
.note{margin-top:14px;min-height:95px;resize:vertical;background:#fbfdfe}
.actions{display:flex;gap:10px;position:sticky;bottom:0;background:rgba(243,248,251,.95);padding:12px 14px;backdrop-filter:blur(8px);z-index:4}
button{border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}
.primary{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff}.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}
@media(max-width:650px){.grid{grid-template-columns:1fr}.hero{min-height:235px;background-position:center}.hero h1{margin-top:60px;font-size:25px}.card{padding:14px}.brand{font-size:18px}}
@media print{
 .brand img{width:85px!important;max-height:42px!important}
 body{background:#fff;font-size:9px}.hero{min-height:90px;padding:8px 14px 12px;background-image:none!important;background:#fff!important;color:#173f5f;border-bottom:3px solid #0d87c8}
 .brand{box-shadow:none;padding:2px 6px;font-size:14px}.hero h1{font-size:16px;margin:5px 0}.hero p{color:#555;font-size:8px}
 .card{box-shadow:none;margin:0;padding:7px}.actions{display:none}.grid{grid-template-columns:repeat(4,1fr);gap:5px}
 .item{break-inside:avoid;padding:6px;margin:3px 0;border-radius:4px}.section-title{font-size:12px;margin:8px 0 3px;padding:4px 7px}
 .options{margin-top:3px}.opt span{padding:2px 6px;font-size:8px}.note{min-height:30px;padding:4px;font-size:8px}
 input{padding:4px;font-size:8px}
}
</style>

function setDateTime() {
  const now = new Date();

  const day = String(now.getDate()).padStart(2, "0");
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const year = now.getFullYear();

  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");

  document.getElementById("date").value =
    `${day}/${month}/${year}`;

  document.getElementById("time").value =
    `${hours}:${minutes}`;
}
